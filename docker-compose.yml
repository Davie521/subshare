services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: subshare
      POSTGRES_PASSWORD: subshare
      POSTGRES_DB: subshare
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subshare -d subshare"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  subshare:
    build: .
    # SESSION_SECRET and CRON_SECRET must be provided via a host-side .env
    # file (docker compose picks it up automatically) or equivalent — no
    # default is baked in, so the container refuses to start without them.
    environment:
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set in .env}
      - CRON_SECRET=${CRON_SECRET:?CRON_SECRET must be set in .env}
      - DATABASE_URL=postgres://subshare:subshare@postgres:5432/subshare
      - PGSSLMODE=disable
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
