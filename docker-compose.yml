services:
  subshare:
    build: .
    environment:
      - SESSION_SECRET=${SESSION_SECRET:-change-me-to-a-random-32-char-string}
      - DATABASE_URL=/app/data/subshare.db
      - NODE_ENV=production
    volumes:
      - subshare-data:/app/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - subshare
    restart: unless-stopped

volumes:
  subshare-data:
  caddy-data:
  caddy-config:
